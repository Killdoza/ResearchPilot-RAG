name: researchpilot-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked runtime and test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Verify repository formatting
        run: ruff format --check .
      - name: Lint repository
        run: ruff check .
      - name: Unit and contract tests
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Secret-pattern scan of tracked files
        run: python scripts/check_no_secrets.py
      - name: Verify checks do not modify the worktree
        run: git diff --exit-code
